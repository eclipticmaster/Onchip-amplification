# yaml-language-server: $schema=../config.schema.json
# CW laser -> native InGaAsP/InP SOA -> microcomb pump link.
# All simulation is native Lumerical; Python only configures and plots exports.
schema_version: 2
name: InP pump amplifier - Lumerical only
parameter_status: illustrative
calibration_notes: >-
  Effective InGaAsP/InP optical cross-section; no measured device data yet.
  Configure/calibrate the active native SOA/CML in INTERCONNECT.
  No gain, carrier, thermal or Kerr dynamics are calculated in Python.
source:
  wavelength_nm: 1550.0
  input_power_mW: 1.0
device:
  length_um: 1000.0
  width_um: 2.0
  core_thickness_um: 0.4
  active_thickness_um: 0.12
  current_mA: 250.0
thermal:
  ambient_K: 300.0  # Sent to the native model only if explicitly bound below.
mode:
  # Fallback effective indices only when native material names below are null.
  core_index: 3.4
  cladding_index: 3.17
  x_span_um: 8.0
  y_span_um: 4.0
# Additional native coefficients go here; bind each to its native model property.
# Units must be those expected by that property. No Python model uses these.
parameters: {}
lumerical:
  hide_gui: false
  keep_open: true  # Reopen the saved project for inspection after a successful run.
  make_figures: true  # CLI run/sweep: export publication figures from native results.
  show_figures: true  # Open the offline gallery after visible runs.
  figure_style: null  # Optional style YAML; relative to the YAML selected on the CLI.
  core_material: null
  cladding_material: null
  mode:
    trial_modes: 6
    mesh_step_nm: 25.0
    wavelength_start_nm: 1500.0
    wavelength_stop_nm: 1600.0
    wavelength_points: 21
  fdtd:
    # Passive diagnostic taper, not the full electrically pumped SOA.
    taper_length_um: 20.0
    input_width_um: 0.8
    buffer_um: 2.0
    transverse_span_um: 4.0
    vertical_span_um: 3.0
    mesh_step_nm: 50.0
    simulation_time_fs: 5000.0
    wavelength_points: 21
    max_estimated_cells: 20000000
  interconnect:
    # Path relative to the selected YAML. Supply your native SOA/CML project.
    template_path: null
    inspect_elements: [pump_laser, inp_soa, bias_current, output_osa]
    # Verify property names and SI units on your selected model/version.
    bindings:
      - element: pump_laser
        property: frequency
        quantity: source.frequency_Hz
      - element: pump_laser
        property: power
        quantity: source.power_W
      - element: bias_current
        property: amplitude
        quantity: device.current_A
    # Add length/volume/material bindings only with verified native property names.
    fixed_properties: []
    results:
      - element: output_osa
        result: spectrum
        label: output_spectrum
# Each value launches a separate native INTERCONNECT case (or exports its script).
sweeps:
  - name: current
    solver: interconnect
    parameter: device.current_mA
    values: [50.0, 100.0, 150.0, 200.0, 250.0, 300.0, 350.0]
  - name: input_power
    solver: interconnect
    parameter: source.input_power_mW
    values: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  - name: width
    solver: mode
    parameter: device.width_um
    values: [1.0, 1.5, 2.0, 2.5, 3.0]
