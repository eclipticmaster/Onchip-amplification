[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inpamp"
version = "0.1.0"
description = "YAML-driven InP SOA and microcomb pump design studies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "matplotlib>=3.8,<4",
  "PyYAML>=6,<7", "pydantic>=2.8,<3", "gdstk>=0.9.55,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
inpamp = "inpamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
